spring.application.name=springfinal

# Base de datos PostgreSQL (Neon o local): solo variables de entorno, nunca credenciales en este archivo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CONTRASENA}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# API publica de tasas de cambio COP -> USD (Rates By Exchange Rate API, https://www.exchangerate-api.com)
tasa-cambio.url=${TASA_CAMBIO_URL:https://open.er-api.com/v6/latest/COP}
tasa-cambio.tiempo-espera=5s
